services:
  - type: web
    name: exam-allocation
    env: node
    plan: free
    buildCommand: npm install && npm install --prefix backend && npm install --prefix frontend && npm run build && node backend/scripts/install-chrome.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MYSQL_URL
        sync: false
      - key: DB_SSL
        value: true
      - key: ADMIN_EMAIL
        value: admin@sjcetpalai.ac.in
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/backend/.cache/puppeteer
